<svg xmlns="http://www.w3.org/2000/svg" width="720" height="170" viewBox="0 0 720 170" role="img" aria-labelledby="title desc">
<title id="title">Download VeliNet VPN for Windows</title>
<desc id="desc">A dark blue and violet download button for VeliNet VPN.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/>
    <stop offset="0.55" stop-color="#0b1730"/>
    <stop offset="1" stop-color="#11102b"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#20d7ff"/>
    <stop offset="0.5" stop-color="#3478ff"/>
