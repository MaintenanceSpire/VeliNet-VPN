  </filter>
  <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
  </filter>
</defs>

<rect x="14" y="14" width="692" height="142" rx="34" fill="url(#bg)" stroke="#1e385a" stroke-width="2" filter="url(#shadow)"/>
<rect x="16" y="16" width="688" height="138" rx="32" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".75"/>

<g transform="translate(48 45)" filter="url(#glow)">
  <circle cx="40" cy="40" r="40" fill="#0b203a" stroke="#24cfff" stroke-width="2"/>
  <path d="M40 17v43m-16-15 16 16 16-16M23 70h34" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<text x="148" y="73" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing=".5">DOWNLOAD VELINET VPN</text>
<text x="149" y="108" fill="#9eb4d3" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="2">FREE FOR WINDOWS  •  QUICK INSTALL</text>

<g transform="translate(634 68)">
  <path d="M0 0h20l12 17-12 17H0l12-17z" fill="url(#accent)" opacity=".9"/>
</g>

<rect x="148" y="128" width="454" height="3" rx="1.5" fill="url(#accent)" opacity=".85"/>
</svg>